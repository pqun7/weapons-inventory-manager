name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-migration.txt

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Install database script dependencies
        run: python -m pip install -r scripts/requirements-migration.txt

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test application with coverage gates
        run: npm run test:coverage

      - name: Test database maintenance scripts
        run: npm run test:db-scripts

      - name: Build renderer
        run: npm run build
        env:
          ARMORY_GENERIC_BUILD: "true"
