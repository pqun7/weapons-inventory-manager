name: Release Windows application

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          if ($packageVersion -ne $tagVersion) {
            throw "Tag version $tagVersion does not match package.json version $packageVersion"
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Detect optional Authenticode credentials
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          $hasLink = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasLink -xor $hasPassword) {
            throw 'Configure both CSC_LINK and CSC_KEY_PASSWORD, or omit both for an unsigned build'
          }
          $enabled = if ($hasLink -and $hasPassword) { 'true' } else { 'false' }
          "HAS_AUTHENTICODE=$enabled" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ($enabled -eq 'false') {
            Write-Warning 'Building an unsigned installer because Authenticode credentials are not configured'
          }

      - name: Build generic Windows package
        run: npm run electron:build:win
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Verify Authenticode signatures before publishing
        if: env.HAS_AUTHENTICODE == 'true'
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $targets = @(
            "release/Armory-Store-Setup-$version-x64.exe"
            'release/win-unpacked/Armory Store.exe'
          )
          foreach ($target in $targets) {
            if (-not (Test-Path -LiteralPath $target)) {
              throw "Signed release target was not produced: $target"
            }
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') {
              throw "Authenticode verification failed for $target: $($signature.Status)"
            }
          }

      - name: Generate release checksums
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''
          $assets = @(
            "release/Armory-Store-Setup-$version-x64.exe"
            "release/Armory-Store-Setup-$version-x64.exe.blockmap"
            'release/latest.yml'
          )
          $lines = foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset)) { throw "Missing release asset: $asset" }
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $asset).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($asset))"
          }
          $lines | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding ascii

      - name: Publish verified artifacts to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $version = $tag -replace '^v', ''
          $assets = @(
            "release/Armory-Store-Setup-$version-x64.exe"
            "release/Armory-Store-Setup-$version-x64.exe.blockmap"
            'release/latest.yml'
            'release/SHA256SUMS.txt'
          )
          if (gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null) {
            gh release upload $tag @assets --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag @assets --verify-tag --generate-notes --repo $env:GITHUB_REPOSITORY
          }

      - name: Upload installer artifacts to workflow run
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: armory-store-windows-${{ github.ref_name }}
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: warn
          retention-days: 14
