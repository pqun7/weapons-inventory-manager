name: Feature request
description: Propose a focused improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What operator or contributor problem should be solved?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the desired behavior and important tradeoffs.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Data, security, and compliance considerations
      description: Note any effect on permissions, auditability, regulated data, or retention.
