appId: com.armory-store.app
productName: Armory Store
copyright: Copyright © 2024 Armory Store Management System

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/*.{md,markdown}"
  - "!**/.{idea,git,cache,vscode,DS_Store}"
  - "!src/**/*"
  - "!electron/**/*"
  - "!**/*.test.*"
  - "!**/*.spec.*"

asar: true

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: "ArmoryStore-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Armory Store
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico

portable:
  artifactName: "ArmoryStore-${version}-portable-${arch}.${ext}"

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: build/icon.icns
  category: public.app-category.business
  artifactName: "ArmoryStore-${version}-${arch}.${ext}"

dmg:
  title: "Armory Store ${version}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  icon: build/icon.png
  category: Office
  artifactName: "ArmoryStore-${version}-${arch}.${ext}"

appImage:
  artifactName: "ArmoryStore-${version}-${arch}.AppImage"

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xauth
    - libatspi2.0-0
    - libdrm2
    - libgbm1
    - libxcb-dri3-0
    - libasound2

publish:
  provider: generic
  url: https://example.com/armory-store-updates/
